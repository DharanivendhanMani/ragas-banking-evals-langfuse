name: rag-eval-gate

# Manual trigger only: a full run calls Groq, Gemini and Langfuse, so it is not run on every push.
# Add GROQ_API_KEY, GOOGLE_API_KEY, LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY as repository secrets
# (and set LANGFUSE_BASE_URL to your region's host).
on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_BASE_URL: https://api.groq.com/openai/v1
      GROQ_MODEL: openai/gpt-oss-120b
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      EMBEDDING_MODEL: gemini-embedding-001
      JUDGE_MODEL: gemini-flash-lite-latest
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: https://us.cloud.langfuse.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m src.ingest
      - run: python -m eval.run_eval --run-id ci-dev --split dev
      - run: python -m eval.gate --run-id ci-dev
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-reports
          path: reports/
